# Quality gates for TestEnvironment.
#
# Four jobs, because the module makes four claims that can only fail on different platforms:
#
#   tests     Windows, PowerShell 7. Pester and PSScriptAnalyzer. Every Graph call, RSAT cmdlet
#             and Okta request in the suite is mocked, so it reaches no tenant, no domain and
#             no org. The AD provider's tests bind against generated stubs under Tests/Stubs,
#             appended to PSModulePath, because the runner has no RSAT.
#
#   desktop   Windows PowerShell 5.1. The manifest declares CompatiblePSEditions Desktop and
#             the root module carries #Requires -Version 5.1. A ternary, a null-coalescing
#             operator or a ForEach-Object -Parallel parses cleanly under 7 and breaks every
#             command under 5.1, and nothing but a 5.1 host notices.
#
#   linux     Ubuntu. RequiredModules is empty precisely so the Entra and Okta providers can
#             seed from a container with no RSAT. This proves the module imports and serves
#             help where there is no Windows PowerShell, no RSAT, and a case-sensitive
#             filesystem.
#
#   help      Ubuntu. The command help gate: the PlatyPS Markdown under docs/ is valid and
#             complete, the committed MAML in en-US/ was built from it, and Get-Help serves
#             every command's full help on a case-sensitive filesystem - the only place the
#             -Help.xml capital H can fail. Export-MamlCommandHelp produces
#             'TestEnvironment-Help.xml' while most documentation writes '-help.xml'. On
#             Windows that mismatch is invisible; on Linux the lookup silently fails and
#             every command loses its help.

name: 'Quality Gates'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

  # Callable so release.yml can run these exact gates before publishing. A tag can be pushed
  # at any commit, including one that never passed a pull request, so the release re-runs the
  # gates rather than trusting that they ran at some point.
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: 'Tests and analysis'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build modules
        shell: pwsh
        run: |
          # Runners ship Pester 5.x. Pester 6 must be installed explicitly, and the version
          # range keeps a future Pester 7 from silently changing the assertion surface. The
          # floor is 6.1 to match the #Requires line every suite carries.
          Install-PSResource -Name Pester -Version '[6.1.0,7.0.0)' -Scope CurrentUser -TrustRepository
          Install-PSResource -Name PSScriptAnalyzer -Scope CurrentUser -TrustRepository

          # The real SecretManagement modules, not the stubs. The Core suites mock every
          # SecretStore call, and the stubs under Tests/Stubs exist only so Pester has a
          # command to attach each mock to. Installing the real modules binds the suites
          # against the true parameter surface instead, which the stubs README says is the
          # preferred case wherever it is available.
          Install-PSResource -Name Microsoft.PowerShell.SecretManagement, Microsoft.PowerShell.SecretStore -Scope CurrentUser -TrustRepository
          $PSVersionTable | ConvertTo-Json -Depth 3

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning
          if ($issues) {
              $issues | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String | Write-Host
              throw "PSScriptAnalyzer reported $($issues.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer clean.'

      - name: Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 6.1.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './Tests/Unit'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) test(s) failed."
          }

  desktop:
    name: 'Windows PowerShell 5.1'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 'powershell' here is Windows PowerShell 5.1, not pwsh. The check is deliberately
      # small: import, count the exports against the manifest, and confirm every command
      # serves its compiled help. Each export carries .EXTERNALHELP, so there is no comment
      # block to fall back on and a description proves 5.1 read en-US/TestEnvironment-Help.xml.
      # A 7-only construct anywhere in the module fails the import itself, which is the
      # failure this job exists to surface.
      - name: Import and verify exports
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))" | Write-Host

          Import-Module ./TestEnvironment.psd1 -Force
          $declared = @((Import-PowerShellDataFile ./TestEnvironment.psd1).FunctionsToExport) | Sort-Object
          $actual = @((Get-Module TestEnvironment).ExportedFunctions.Keys) | Sort-Object

          if (($declared -join ',') -ne ($actual -join ',')) {
              throw "Exports differ from the manifest. Declared: $($declared.Count); actual: $($actual.Count)."
          }

          $noHelp = @(foreach ($name in $actual) {
              if (-not (Get-Help $name -ErrorAction SilentlyContinue).Description) { $name }
          })
          if ($noHelp) { throw "Commands serving no help under 5.1: $($noHelp -join ', ')" }

          Write-Host "All $($actual.Count) commands exported with help under Windows PowerShell 5.1."

  linux:
    name: 'Import on Linux'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Import and verify exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "PowerShell $($PSVersionTable.PSVersion) on $($PSVersionTable.OS)" | Write-Host

          Import-Module ./TestEnvironment.psd1 -Force
          $declared = @((Import-PowerShellDataFile ./TestEnvironment.psd1).FunctionsToExport) | Sort-Object
          $actual = @((Get-Module TestEnvironment).ExportedFunctions.Keys) | Sort-Object

          if (($declared -join ',') -ne ($actual -join ',')) {
              throw "Exports differ from the manifest. Declared: $($declared.Count); actual: $($actual.Count)."
          }

          # Every provider folder must be discovered, including its seed data, on a
          # case-sensitive filesystem. A path assembled with the wrong case works on Windows
          # and finds nothing here.
          $providers = @(Get-TestEnvironmentProvider)
          $onDisk = @(Get-ChildItem ./Providers -Directory).Name | Sort-Object
          if ((($providers.Name | Sort-Object) -join ',') -ne ($onDisk -join ',')) {
              throw "Providers discovered: $($providers.Name -join ', '); on disk: $($onDisk -join ', ')."
          }
          $noSeed = @($providers | Where-Object { $_.SeedFiles -le 0 })
          if ($noSeed) { throw "Providers with no seed data on Linux: $($noSeed.Name -join ', ')" }

          # The deep help check lives in the help job; this only proves the import path
          # found the MAML at all, which is the case-sensitivity failure in its simplest form.
          $noHelp = @(foreach ($name in $actual) {
              if (-not (Get-Help $name -ErrorAction SilentlyContinue).Description) { $name }
          })
          if ($noHelp) { throw "Commands serving no help on Linux: $($noHelp -join ', ')" }

          Write-Host "All $($actual.Count) commands exported with help; $($providers.Count) providers discovered with seed data."

  help:
    name: 'Command help'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned exactly, not by minimum. The staleness check below compares a rebuilt MAML
      # against the committed one byte for byte, so a PlatyPS release that changes the
      # emitted XML at all would fail the build for a reason nobody changed. Bump this
      # deliberately, rebuild, and commit the result in the same change.
      - name: Install PlatyPS
        shell: pwsh
        run: |
          Install-PSResource -Name Microsoft.PowerShell.PlatyPS -Version '1.0.3' -Scope CurrentUser -TrustRepository
          $PSVersionTable | ConvertTo-Json -Depth 3

      # Structure, unfilled templates, relative RELATED LINKS, drift against the exported
      # command list, and an exported function that has lost its .EXTERNALHELP keyword.
      - name: Validate help Markdown
        shell: pwsh
        run: ./Build/Build-Help.ps1 -ValidateOnly

      # Rebuild from the committed Markdown and compare against the committed MAML. If they
      # differ, someone edited docs/ without running the build - and .EXTERNALHELP means
      # users would be served the stale content rather than falling back to anything correct.
      - name: Fail on stale committed MAML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $committed = './en-US/TestEnvironment-Help.xml'
          if (-not (Test-Path $committed)) { throw "No committed help at $committed." }
          $before = (Get-FileHash $committed -Algorithm SHA256).Hash

          ./Build/Build-Help.ps1 | Out-Null

          $after = (Get-FileHash $committed -Algorithm SHA256).Hash
          if ($before -ne $after) {
              throw 'en-US/TestEnvironment-Help.xml is out of date. Run ./Build/Build-Help.ps1 and commit the result.'
          }
          Write-Host 'Committed MAML matches the Markdown.'

      # The point of running this job on Linux. Get-Help resolves .EXTERNALHELP against the
      # culture folder by exact filename, so a casing mismatch fails here and only here.
      - name: Verify Get-Help on a case-sensitive filesystem
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./TestEnvironment.psd1 -Force

          $failed = @()
          foreach ($command in (Get-Module TestEnvironment).ExportedFunctions.Keys | Sort-Object) {
              $help = Get-Help $command -Full

              # An autogenerated stub is the symptom of MAML that was not found: PowerShell
              # falls back to reflected syntax with no description and no examples.
              if (-not $help.Description) { $failed += "$command : no description" ; continue }
              if (@($help.Examples.Example).Count -lt 3) { $failed += "$command : fewer than 3 examples" ; continue }

              # Parameter help is required only where the command declares parameters. The
              # Get-* dispatchers declare none of their own - everything they accept is
              # mirrored from the provider at binding time - so their MAML rightly has no
              # parameter entries, and demanding some would fail a correct build.
              $common = [System.Management.Automation.PSCmdlet]::CommonParameters +
                  [System.Management.Automation.PSCmdlet]::OptionalCommonParameters
              $declared = @((Get-Command $command).Parameters.Keys | Where-Object { $_ -notin $common })
              if ($declared -and -not $help.parameters.parameter) { $failed += "$command : no parameter help" ; continue }

              Write-Host ("{0,-34} {1} examples, {2} parameters" -f
                  $command, @($help.Examples.Example).Count, @($help.parameters.parameter).Count)
          }

          if (-not (Get-Help about_TestEnvironment -ErrorAction SilentlyContinue)) {
              $failed += 'about_TestEnvironment : topic not found'
          }

          if ($failed) {
              $failed | ForEach-Object { Write-Host "FAILED: $_" }
              throw 'MAML help was not served on a case-sensitive filesystem.'
          }
          Write-Host 'All commands served full help from MAML.'
